<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaskData</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> 
    <link rel="stylesheet" href="./css/index.css">
    <link rel="shortcut icon" href="./img/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="src-code">
        <p>Link to Source Code on GitHub: <a href="https://github.com/siwat-soong/mask_data_web_application" target="_blank">https://github.com/siwat-soong/mask_data_web_application</a></p>
    </div>
    <div class="ui">
        <div class="upload hidden">
            <div class="panel">
                <i class="bi bi-upload"></i>
                <div class="label">
                    <h1>Drop File here, or <a href="#">Browse</a></h1>
                    <p class="support-txt">Supports: txt, csv,png</p>
                </div>
            </div>
        </div>
        <div class="container">
            <div class="logo">
                <a href="index.html"><img src="./img/toc_logo.svg" alt="logo_image" class="logo-img"></a>
                <h1 class="slogan">Protect Personal Data Instantly</h1>
            </div>
            <div class="chat">
                <div class="text-field">
                    <textarea class="text-input" placeholder="To mask data for PDPA, enter, paste or import file here and press “Mask”."></textarea>
                    <div class="field-icon">
                        <div class="hug">
                            <i class="bi bi-clipboard"></i>
                            <i class="bi bi-box-arrow-in-down"></i>
                        </div>
                        <a href="render.html"><i class="bi bi-arrows-angle-expand"></i></a>
                    </div>
                    <i class="bi bi-trash trash-icon hidden"></i>
                </div>
                <div class="control-btn">
                    <div class="import-btn">
                        <div class="import-csv import-bat">
                            <i class="bi bi-grid-3x3"></i>
                            <p>Import csv file</p>
                        </div>
                        <div class="import-txt import-bat">
                            <i class="bi bi-justify-left"></i>
                            <p>Import txt file</p>
                        </div>
                        <div class="import-img import-bat">
                            <i class="bi bi-image"></i>
                            <p>Import png file</p>
                        </div>
                    </div>
                    <button>Mask</button>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="file-input" hidden>  
    <script src="./js/api.js"></script>
    <script src="./js/index.js"></script>
</body>
</html>
