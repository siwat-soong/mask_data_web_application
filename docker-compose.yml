services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    ports: ["80:80", "443:443"]
    environment:
      # backend's own limit is 2MB (backend/files.py); give multipart
      # upload overhead some headroom so nginx-proxy doesn't reject first.
      - CLIENT_MAX_BODY_SIZE=3m
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro

  acme-companion:
    image: nginxproxy/acme-companion
    depends_on: [nginx-proxy]
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro

  backend:
    build: .
    expose: ["8000"]
    environment:
      - CORS_ORIGINS=*
      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PATH=/api
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}

  frontend:
    image: nginx:alpine
    expose: ["80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    environment:
      - VIRTUAL_HOST=${DOMAIN}
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}

volumes:
  certs:
  vhost:
  html:
  acme:
