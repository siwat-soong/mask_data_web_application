services:
  backend:
    build: .
    expose: ["8000"]
    environment:
      - CORS_ORIGINS=*

  frontend:
    image: nginx:alpine
    expose: ["80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, backend]
